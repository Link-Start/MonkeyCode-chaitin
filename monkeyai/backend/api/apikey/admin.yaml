openapi: 3.1.0
info:
  title: MonkeyAI API Key Admin API
  version: 1.0.0
paths:
  /api/admin/v1/api-keys:
    get:
      summary: 查询调用密钥
      responses:
        "200":
          description: 调用密钥元数据列表
  /api/admin/v1/api-keys/{keyID}:
    parameters:
      - in: path
        name: keyID
        required: true
        schema:
          type: string
          format: uuid
    delete:
      summary: 管理员撤销调用密钥
      responses:
        "204":
          description: 撤销成功
